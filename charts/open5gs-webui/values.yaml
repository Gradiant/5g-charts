## @section open5gs-webui parameters

## Bitnami open5gs image version
## ref: https://hub.docker.com/r/gradiant/open5gs/tags/
## @param image.registry Open5gs image registry
## @param image.repository Open5gs Image name
## @param image.tag Open5gs Image tag
## @param image.digest Open5gs image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy Open5gs image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
## @param image.debug Specify if debug logs should be enabled
##
image:
  # -- Container image registry.
  registry: docker.io
  # -- Container image repository.
  repository: gradiant/open5gs-webui
  # -- Container image tag.
  tag: "2.7.5"
  # -- Optional image digest; takes precedence over the tag.
  digest: ""
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  # -- Image pull policy: Always, IfNotPresent or Never.
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  # -- Image pull Secret names in the workload namespace.
  pullSecrets: []
  ## Set to true if you would like to see extra information on logs
  ##
  # -- Specify if debug logs should be enabled
  debug: false

## @param replicaCount Number of open5gs-webui Pods to run (requires ReadWriteMany PVC support)
##
# -- Number of application replicas.
replicaCount: 1
## @param command Override default container command (useful when using custom images)
##
# -- Override default container command (useful when using custom images)
command: []
## @param args Override default container args (useful when using custom images)
##
# -- Override default container args (useful when using custom images)
args: []
## @param updateStrategy.type Update strategy - only really applicable for deployments with RWO PVs attached
## If replicas = 1, an update can get "stuck", as the previous pod remains attached to the
## PV, and the "incoming" pod can never start. Changing the strategy to "Recreate" will
## terminate the single previous pod, so that the new, incoming pod can attach to the PV
##
updateStrategy:
  # -- Update strategy - only really applicable for deployments with RWO PVs attached
  type: RollingUpdate
## @param priorityClassName open5gs-webui pods' priorityClassName
##
# -- open5gs-webui pods' priorityClassName
priorityClassName: ""
## @param schedulerName Name of the k8s scheduler (other than default)
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
# -- Name of the k8s scheduler (other than default)
schedulerName: ""
## @param topologySpreadConstraints Topology Spread Constraints for pod assignment
## https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
## The value is evaluated as a template
##
# -- Topology Spread Constraints for pod assignment
topologySpreadConstraints: []
## @param hostAliases [array] Add deployment host aliases
## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
# -- [array] Add deployment host aliases
hostAliases: []
## @param extraEnvVars Extra environment variables
## For example:
##
# -- Extra environment variables
extraEnvVars: []
#  - name: BEARER_AUTH
#    value: true
## @param extraEnvVarsCM ConfigMap containing extra env vars
##
# -- ConfigMap containing extra env vars
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Secret containing extra env vars (in case of sensitive data)
##
# -- Secret containing extra env vars (in case of sensitive data)
extraEnvVarsSecret: ""
## @param extraVolumes Array of extra volumes to be added to the deployment (evaluated as template). Requires setting `extraVolumeMounts`
##
# -- Array of extra volumes to be added to the deployment (evaluated as template). Requires setting `extraVolumeMounts`
extraVolumes: []
## @param extraVolumeMounts Array of extra volume mounts to be added to the container (evaluated as template). Normally used with `extraVolumes`.
##
# -- Array of extra volume mounts to be added to the container (evaluated as template). Normally used with `extraVolumes`.
extraVolumeMounts: []
## @param initContainers Add additional init containers to the pod (evaluated as a template)
##
# -- Add additional init containers to the pod (evaluated as a template)
initContainers: []
## @param sidecars Attach additional containers to the pod (evaluated as a template)
##
# -- Attach additional containers to the pod (evaluated as a template)
sidecars: []
## @param tolerations Tolerations for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
# -- Tolerations for pod assignment
tolerations: []
serviceAccount:
  ## @param serviceAccount.create Specifies whether a service account should be created
  ##
  # -- Specifies whether a service account should be created
  create: false
  ## @param serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  ##
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""
  ## @param serviceAccount.annotations Add annotations
  ##
  # -- Add annotations
  annotations: {}
  ## @param serviceAccount.automountServiceAccountToken Automount API credentials for a service account.
  ##
  # -- Automount API credentials for a service account.
  automountServiceAccountToken: true
## @param containerPorts [object] Container ports
##
containerPorts:
  # -- Container port for HTTP.
  http: 9999
## @param sessionAffinity Control where client requests go, to the same pod or round-robin. Values: ClientIP or None
## ref: https://kubernetes.io/docs/user-guide/services/
##
# -- Control where client requests go, to the same pod or round-robin. Values: ClientIP or None
sessionAffinity: "None"

## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
# -- Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
# -- Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
podAntiAffinityPreset: soft
## Node affinity preset
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param nodeAffinityPreset.key Node label key to match Ignored if `affinity` is set.
## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
##
nodeAffinityPreset:
  # -- Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  type: ""
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  # -- Node label key to match Ignored if `affinity` is set.
  key: ""
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  # -- Node label values to match. Ignored if `affinity` is set.
  values: []
## @param affinity Affinity for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## Note: podAffinityPreset, podAntiAffinityPreset, and nodeAffinityPreset will be ignored when it's set
##
# -- Affinity for pod assignment
affinity: {}
## @param nodeSelector Node labels for pod assignment. Evaluated as a template.
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
# -- Node labels for pod assignment. Evaluated as a template.
nodeSelector: {}
## open5gs-webui container's resource requests and limits
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
## @param resources.requests [object] The requested resources for the init container
## @param resources.limits The resources limits for the init container
##
resources:
  requests:
    # -- Container cpu request as a Kubernetes quantity (for example 100m).
    cpu: 50m
    # -- Container memory request as a Kubernetes quantity (for example 128Mi).
    memory: 64Mi
  limits:
    # -- Container cpu limit as a Kubernetes quantity (for example 100m).
    cpu: 500m
    # -- Container memory limit as a Kubernetes quantity (for example 128Mi).
    memory: 512Mi
## Configure Pods Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enable open5gs-webui pods' Security Context
## @param podSecurityContext.fsGroup open5gs-webui pods' group ID
##
podSecurityContext:
  # -- Apply this security context.
  enabled: true
  # -- Group used for mounted-volume access.
  fsGroup: 999
## Configure Container Security Context (only main container)
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enable open5gs-webui containers' Security Context
## @param containerSecurityContext.runAsUser open5gs-webui containers' Security Context
## @param containerSecurityContext.runAsGroup open5gs-webui containers' Security Context runAsGroup
## @param containerSecurityContext.runAsNonRoot Set Controller container's Security Context runAsNonRoot
##
containerSecurityContext:
  # -- Apply this security context.
  enabled: true
  # -- UID used by this security context.
  runAsUser: 999
  # -- GID used by this security context.
  runAsGroup: 999
  # -- Require the container to run as a non-root user.
  runAsNonRoot: true
## Configure extra options for startup probe
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param startupProbe.enabled Enable startupProbe
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  # -- Enable the default startup probe. A non-empty custom probe takes priority.
  enabled: true
  # -- Delay in seconds before checks can begin (minimum 0). Application probes run after init containers.
  initialDelaySeconds: 0
  # -- Interval between checks in seconds (minimum 1).
  periodSeconds: 5
  # -- Timeout for one check in seconds (minimum 1).
  timeoutSeconds: 2
  # -- Consecutive failed checks allowed during startup before a restart; the budget is approximately this value multiplied by periodSeconds.
  failureThreshold: 60
  # -- Consecutive successes required; Kubernetes requires 1 for startup and liveness.
  successThreshold: 1
## Configure extra options for liveness probe
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param livenessProbe.enabled Enable livenessProbe
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  # -- Enable the default liveness probe. A non-empty custom probe takes priority.
  enabled: true
  # -- Delay in seconds before checks can begin (minimum 0). Application probes run after init containers.
  initialDelaySeconds: 0
  # -- Interval between checks in seconds (minimum 1).
  periodSeconds: 10
  # -- Timeout for one check in seconds (minimum 1).
  timeoutSeconds: 2
  # -- Consecutive failed checks before restarting the container after startup has succeeded.
  failureThreshold: 3
  # -- Consecutive successes required; Kubernetes requires 1 for startup and liveness.
  successThreshold: 1
## Configure extra options for readiness probe
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param readinessProbe.enabled Enable readinessProbe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  # -- Enable the default readiness probe. A non-empty custom probe takes priority.
  enabled: true
  # -- Delay in seconds before checks can begin (minimum 0). Application probes run after init containers.
  initialDelaySeconds: 0
  # -- Interval between checks in seconds (minimum 1).
  periodSeconds: 5
  # -- Timeout for one check in seconds (minimum 1).
  timeoutSeconds: 2
  # -- Consecutive failed checks before marking the Pod NotReady; this does not restart the container.
  failureThreshold: 3
  # -- Consecutive successes needed to restore readiness (minimum 1).
  successThreshold: 1
## @param customStartupProbe Override default startup probe
##
# -- Complete replacement for the default probe, taking priority even when it is enabled. Empty uses the default or omits it when disabled.
customStartupProbe: {}
## @param customLivenessProbe Override default liveness probe
##
# -- Complete replacement for the default probe, taking priority even when it is enabled. Empty uses the default or omits it when disabled.
customLivenessProbe: {}
## @param customReadinessProbe Override default readiness probe
##
# -- Complete replacement for the default probe, taking priority even when it is enabled. Empty uses the default or omits it when disabled.
customReadinessProbe: {}
## @param lifecycleHooks LifecycleHook to set additional configuration at startup Evaluated as a template
##
# -- LifecycleHook to set additional configuration at startup Evaluated as a template
lifecycleHooks: {}
## @param podAnnotations Pod annotations
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
# -- Pod annotations
podAnnotations: {}
## @param podLabels Add additional labels to the pod (evaluated as a template)
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
# -- Add additional labels to the pod (evaluated as a template)
podLabels: {}

## @section Traffic Exposure Parameters

## Kubernetes configuration. For minikube, set this to NodePort, elsewhere use LoadBalancer
##
services:
  http:
    # -- Publish unready Pod endpoints; enable only for required bootstrap/discovery or metrics diagnostics.
    publishNotReadyAddresses: false
    ## @param service.type Kubernetes Service type
    ##
    # -- Kubernetes Service type: ClusterIP, NodePort or LoadBalancer.
    type: ClusterIP
    ## @param service.ports.http Service HTTP port
    ##
    ports:
      # -- Service port for HTTP.
      http: 9999
    ## @param service.loadBalancerSourceRanges Restricts access for LoadBalancer (only with `service.type: LoadBalancer`)
    ## e.g:
    ## loadBalancerSourceRanges:
    ##   - 0.0.0.0/0
    ##
    loadBalancerSourceRanges: []
    ## @param service.loadBalancerIP loadBalancerIP for the open5gs-webui Service (optional, cloud specific)
    ## ref: https://kubernetes.io/docs/user-guide/services/#type-loadbalancer
    loadBalancerIP: ""
    ## @param service.nodePorts [object] Kubernetes node port
    ## nodePorts:
    ##   http: <to set explicitly, choose port between 30000-32767>
    ##
    nodePorts:
      # -- NodePort override; empty lets Kubernetes allocate the port.
      http: ""
    ## @param service.externalTrafficPolicy Enable client source IP preservation
    ## ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    # -- Traffic policy for externally exposed Services.
    externalTrafficPolicy: Cluster
    ## @param service.clusterIP %%MAIN_CONTAINER_NAME%% service Cluster IP
    ## e.g.:
    ## clusterIP: None
    ##
    # -- Fixed Service cluster IP; empty lets Kubernetes allocate it.
    clusterIP: ""
    ## @param service.extraPorts Extra ports to expose (normally used with the `sidecar` value)
    ##
    extraPorts: []
    ## @param service.annotations Additional custom annotations for %%MAIN_CONTAINER_NAME%% service
    ##
    annotations: {}
    ## @param service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
    ## If "ClientIP", consecutive client requests will be directed to the same Pod
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
    ##
    # -- Service session-affinity policy.
    sessionAffinity: None
    ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
    ## sessionAffinityConfig:
    ##   clientIP:
    ##     timeoutSeconds: 300
    ##
    sessionAffinityConfig: {}

ingress:
  ## @param ingress.enabled Enable ingress controller resource
  ##
  # -- Enable ingress controller resource
  enabled: true
  ## @param ingress.pathType Ingress Path type
  ##
  # -- Ingress Path type
  pathType: ImplementationSpecific
  ## @param ingress.apiVersion Override API Version (automatically detected if not set)
  ##
  # -- Override API Version (automatically detected if not set)
  apiVersion: ""
  ## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  # -- IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ingressClassName: ""
  ## @param ingress.hostname Default host for the ingress resource
  ##
  # -- Default host for the ingress resource
  hostname: ""
  ## @param ingress.path The Path to WebUI.
  # -- The Path to WebUI.
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## For a full list of possible ingress annotations, please see
  ## ref: https://github.com/kubernetes/ingress-nginx/blob/master/docs/user-guide/nginx-configuration/annotations.md
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ##
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  # -- Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  annotations: {}
  ## @param ingress.tls Enable TLS configuration for the hostname defined at ingress.hostname parameter
  ## TLS certificates will be retrieved from a TLS secret with name: {{- printf "%s-tls" .Values.ingress.hostname }}
  ## You can use the ingress.secrets parameter to create this TLS secret or relay on cert-manager to create it
  ##
  # -- Enable TLS configuration for the hostname defined at ingress.hostname parameter
  tls: false
  ## @param ingress.extraHosts The list of additional hostnames to be covered with this ingress record.
  ## Most likely the hostname above will be enough, but in the event more hosts are needed, this is an array
  ## extraHosts:
  ## - name: lab5g.local
  ##   path: /
  # -- The list of additional hostnames to be covered with this ingress record.
  extraHosts: []
  ## @param ingress.extraPaths Any additional arbitrary paths that may need to be added to the ingress under the main host.
  ## For example: The WebUI ingress controller requires a special rule for handling SSL redirection.
  ## extraPaths:
  ## - path: /*
  ##   backend:
  ##     serviceName: ssl-redirect
  ##     servicePort: use-annotation
  # -- Any additional arbitrary paths that may need to be added to the ingress under the main host.
  extraPaths: []
  ## @param ingress.extraTls The tls configuration for additional hostnames to be covered with this ingress record.
  ## see: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  ## extraTls:
  ## - hosts:
  ##     - webui.local
  ##   secretName: webui.local-tls
  # -- The tls configuration for additional hostnames to be covered with this ingress record.
  extraTls: []
  ## @param ingress.secrets If you're providing your own certificates, please use this to add the certificates as secrets
  ## key and certificate should start with -----BEGIN CERTIFICATE----- or
  ## -----BEGIN RSA PRIVATE KEY-----
  ##
  ## name should line up with a tlsSecret set further up
  ## If you're using cert-manager, this is unneeded, as it will create the secret for you if it is not set
  ##
  ## It is also possible to create and manage the certificates outside of this helm chart
  ## Please see README.md for more information
  ## Example:
  ## - name: webui.local-tls
  ##   key:
  ##   certificate:
  ##
  # -- If you're providing your own certificates, please use this to add the certificates as secrets
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules
  ## e.g:
  ## extraRules:
  ## - host: example.local
  ##     http:
  ##       path: /
  ##       backend:
  ##         service:
  ##           name: example-svc
  ##           port:
  ##             name: http
  ##
  # -- Additional rules to be covered with this ingress record
  extraRules: []

# Wait for the configured database before starting Open5GS.
mongodbWait:
  # -- Wait for a successful MongoDB ping before application or subscriber initialization.
  enabled: true
  # -- Maximum wait per init-container attempt in seconds (1-86400), not a fixed delay; Kubernetes may retry failed attempts.
  timeoutSeconds: 300
  # -- Delay between unsuccessful connection attempts in seconds (1-3600).
  retryIntervalSeconds: 5
  image:
    # -- Container image registry.
    registry: docker.io
    # -- Container image repository.
    repository: library/mongo
    # -- Container image tag.
    tag: "8.0.34"
    # -- Optional image digest; takes precedence over the tag.
    digest: ""
    # -- Image pull policy: Always, IfNotPresent or Never.
    pullPolicy: IfNotPresent
  resources:
    requests:
      # -- Container cpu request as a Kubernetes quantity (for example 100m).
      cpu: 50m
      # -- Container memory request as a Kubernetes quantity (for example 128Mi).
      memory: 128Mi
    limits:
      # -- Container cpu limit as a Kubernetes quantity (for example 100m).
      cpu: "1"
      # -- Container memory limit as a Kubernetes quantity (for example 128Mi).
      memory: 512Mi

# -- MongoDB URI; empty selects <release>-mongodb and its configured Service port. Helm templating is supported.
dbURI: ""  # if empty default is mongodb://<release>-mongodb/open5gs
mongodb:
  # mongodb.enabled -- set to 'false' to disable automatically deploying dependent charts
  # -- Deploy the bundled local MongoDB chart; disable it when using an external database.
  enabled: false
  auth:
    # -- The local MongoDB chart does not implement authentication; keep false or use an authenticated external database.
    enabled: false
