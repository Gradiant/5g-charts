image:
  repository: mongo
  tag: 8.0.34
  pullPolicy: IfNotPresent

auth:
  enabled: false

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  # Create a ServiceAccount for MongoDB.
  create: true
  # The ServiceAccount to use. Empty: <release>-mongodb when create is true,
  # otherwise the namespace's default.
  name: ""
  annotations: {}
  # MongoDB does not use the Kubernetes API.
  automountServiceAccountToken: false

service:
  port: 27017
