apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mongodb" .Release.Name }}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: mongodb
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
