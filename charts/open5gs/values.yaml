dbURI: "mongodb://{{ .Release.Name }}-mongodb/open5gs"

populate:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-dbctl
    tag: 0.10.3
    pullPolicy: IfNotPresent
  initCommands: []
  serviceAccount:
    # -- Create a ServiceAccount for the populate Deployment
    create: true
    # -- The ServiceAccount to use; empty uses the fullname with a -populate suffix when create is true, otherwise default
    name: ""
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Mount an API token; populate does not use the Kubernetes API
    automountServiceAccountToken: false
  # example of initCommands:
  #  - open5gs-dbctl add 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA
  #  - open5gs-dbctl add_ue_with_apn 999700000000002 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet
  #  - open5gs-dbctl add_ue_with_slice 999700000000003 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111

# Common
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: 8.0.34
  persistence:
    enabled: true
    size: 8Gi
  auth:
    enabled: false
smf:
  enabled: true
upf:
  enabled: true
webui:
  enabled: true

# 4G
hss:
  enabled: true
  mongodb:
    enabled: false
mme:
  enabled: true
pcrf:
  enabled: true
  mongodb:
    enabled: false
sgwc:
  enabled: true
sgwu:
  enabled: true

# 5G
amf:
  enabled: true
ausf:
  enabled: true
bsf:
  enabled: true
nrf:
  enabled: true
nssf:
  enabled: true
pcf:
  enabled: true
  mongodb:
    enabled: false
scp:
  enabled: true
  mongodb:
    enabled: false
sepp:
  enabled: true
udm:
  enabled: true
udr:
  enabled: true
  mongodb:
    enabled: false
