# CNTi Test Suite configuration for the open5gs chart, used by
# .github/workflows/cnti.yml. The chart is installed with its defaults and
# the values in values.yaml next to this file.
config_version: "v2"
common:
  # Addresses the chart's defaults carry on purpose: the public resolvers the
  # core hands to UEs, and the gateway of the UE subnet.
  hardcoded_ip_exceptions:
    - ip: 8.8.8.8
    - ip: 8.8.4.4
    - ip: 10.45.0.1
deployments:
  helm_dirs:
    - name: open5gs
      # Relative to this file.
      helm_directory: ../../charts/open5gs
      namespace: open5gs
      helm_values: -f .github/cnti/values.yaml
