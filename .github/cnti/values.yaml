# What the essential-tests run sets on top of the chart's defaults. Nothing here changes
# a practice the tests judge: the 5G core only (no EPC parts, WebUI or
# subscriber population), MongoDB without persistence, and the SMF not looking
# for an absent PCRF.
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false
webui:
  enabled: false
populate:
  enabled: false
mongodb:
  persistence:
    enabled: false
smf:
  config:
    pcrf:
      enabled: false
