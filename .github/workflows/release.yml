name: Release Charts

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit to compare when recovering a release
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  # Generate the values for charts with changes
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: files
        uses: tj-actions/changed-files@v46
        with:
          json: true
          escape_json: false
          base_sha: ${{ inputs.base_sha }}
      - name: Generate Matrix Content
        id: generate-matrix
        env:
          CHANGED_FILES: ${{ steps.files.outputs.all_changed_files }}
        run: |
          matrix=$(python3 scripts/release-matrix.py <<< "$CHANGED_FILES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  chart-release:
    needs: generate-matrix
    if: ${{ github.ref == 'refs/heads/main' && needs.generate-matrix.outputs.matrix != '{"chart":[]}' }}
    runs-on: ubuntu-latest
    env:
      registry: registry-1.docker.io/gradiantcharts
    strategy:
      matrix: ${{ fromJson( needs.generate-matrix.outputs.matrix ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.16.0
      - name: Login to OCI Registry
        run: |
            echo "Attempting to login to registry server ${registry%%/*}"
            helm registry login -u $username -p $password ${registry%%/*}
        env:
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}
      - name: push chart
        id: push
        run: |
            echo "Packaging chart '${{ matrix.chart }}'..."
            helm dep update charts/${{ matrix.chart }}
            helm package charts/${{ matrix.chart }}
            echo "Push package '${{ matrix.chart }}' to $registry ..."
            helm push ${{ matrix.chart }}*.tgz oci://$registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}
      - name: push metadata
        id: push-metadata
        run: |
            echo "Pushing '${{ matrix.chart }}' metadata for artifacthub.io ..."
            cd charts/${{ matrix.chart }}
            oras push \
              $registry/${{ matrix.chart }}:artifacthub.io \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
