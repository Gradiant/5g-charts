name: Lint and Test Charts

on: 
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Generate the values for images with changes
  check-changed:
    runs-on: ubuntu-24.04
    # Map a step output to a job output
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          target_branch="${{ github.event.repository.default_branch }}"
          changed=$(ct list-changed --target-branch "${{ github.event.repository.default_branch }}" || true)
          workflow_changed=$(git diff --name-only "origin/${target_branch}...HEAD" -- .github/workflows/lint-test.yaml)
          if printf '%s\n' "$changed" | grep -q '^charts/' || [[ -n "$workflow_changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed charts; skipping lint and test."
          fi

  lint:
    runs-on: ubuntu-24.04
    needs:  check-changed
    if: needs.check-changed.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Set up helm dep repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --target-branch "${{ github.event.repository.default_branch }}"

  test:
    runs-on: ubuntu-24.04
    needs:  [check-changed, lint]
    if: needs.check-changed.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Set up helm dep repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
   
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.0
          wait: 120s

      - name: Install metallb
        run: |
            kind_IP=$(docker network inspect -f '{{index (index .IPAM.Config 0) "Gateway" }}' kind)
            kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
            kubectl rollout status deployment/controller -n metallb-system --timeout=120s
            kubectl rollout status daemonset/speaker -n metallb-system --timeout=120s
            cat <<EOF | kubectl apply -f -
            apiVersion: metallb.io/v1beta1
            kind: IPAddressPool
            metadata:
              name: default
              namespace: metallb-system
            spec:
              addresses:
              - ${kind_IP}00-${kind_IP}20
            ---
            apiVersion: metallb.io/v1beta1
            kind: L2Advertisement
            metadata:
              name: default
              namespace: metallb-system
            spec:
              ipAddressPools:
              - default
            EOF

      - name: Run chart-testing (install)
        run: |
          target_branch="${{ github.event.repository.default_branch }}"
          changed_charts=$(ct list-changed --target-branch "${{ github.event.repository.default_branch }}")
          independent_charts=()
          open5gs_changed=false
          if ! git diff --quiet "origin/${target_branch}...HEAD" -- .github/workflows/lint-test.yaml; then
            open5gs_changed=true
          fi

          while IFS= read -r chart; do
            [[ -z "$chart" ]] && continue
            chart_name=${chart#charts/}
            case "$chart_name" in
              open5gs|open5gs-*) open5gs_changed=true ;;
              *) independent_charts+=("$chart") ;;
            esac
          done <<< "$changed_charts"

          if ((${#independent_charts[@]} > 0)); then
            chart_args=()
            for chart in "${independent_charts[@]}"; do
              chart_args+=(--charts "$chart")
            done
            ct install "${chart_args[@]}" \
              --target-branch "${{ github.event.repository.default_branch }}"
          fi

          if [[ "$open5gs_changed" == true ]]; then
            helm dependency build charts/open5gs
            helm upgrade --install open5gs charts/open5gs \
              --namespace open5gs \
              --create-namespace \
              --wait \
              --timeout 10m
          fi

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get deployments,statefulsets,daemonsets,persistentvolumeclaims,services -A || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl describe deployments -n open5gs || true
          kubectl logs -n open5gs --all-containers --prefix --tail=100 \
            -l app.kubernetes.io/instance=open5gs || true
          helm status open5gs --namespace open5gs || true
