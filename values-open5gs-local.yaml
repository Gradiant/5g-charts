# Prueba local de Open5GS 5G con UERANSIM.
# Abonado y claves de ejemplo: solo para pruebas.
# MongoDB es efimero: los datos se pierden al recrear su Pod.

webui:
  enabled: true

mongodb:
  persistence:
    enabled: false

# Desactivar las funciones 4G.
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false
sepp:
  enabled: false

smf:
  config:
    pcrf:
      enabled: false

# PLMN y slice coincidentes con los valores por defecto de UERANSIM.
amf:
  config:
    plmnList:
      - plmn_id:
          mcc: "999"
          mnc: "70"
        s_nssai:
          - sst: 1
            sd: "111111"

nssf:
  config:
    nsiList:
      - uri: ""
        sst: 1
        sd: "111111"

populate:
  enabled: true
  initCommands:
    - open5gs-dbctl add_ue_with_slice 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111
